spring.application.name=cristalmaster

# ---------------------------------------------------------------
# Conexão com o banco (MySQL)
# Os valores após ":" são padrões para desenvolvimento local.
# Para sobrescrever, defina as variáveis de ambiente DB_HOST, DB_PORT,
# DB_NAME, DB_USER e DB_PASSWORD. Nunca versione senhas reais.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cristalmaster}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:cristal}
spring.datasource.password=${DB_PASSWORD:troque_esta_senha}

# ---------------------------------------------------------------
# JPA / Hibernate
# "update" cria/ajusta tabelas automaticamente a partir das entidades
# (bom para desenvolvimento e demonstração; em produção usar migrations).
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Servidor
server.port=8080
