# Perfil "https": a câmera do celular só libera a leitura de QR em HTTPS (ou localhost).
# Usa um certificado autoassinado gerado por iniciar.ps1 (pasta certs/, fora do Git).
# O celular mostra um aviso de certificado na primeira vez: toque em "Avançado" e continue.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:certs/cristalmaster.p12
server.ssl.key-store-type=PKCS12
# Senha só do certificado local de teste (não protege dado nenhum do sistema).
server.ssl.key-store-password=cristalmaster
