# Perfil "mysql": usa o MySQL em vez do H2 embutido.
# Como usar (PowerShell, na pasta do projeto):
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=mysql"
# Servidor localhost, porta 3306, banco "cristalmaster". createDatabaseIfNotExist=true: o driver cria o banco
# sozinho na primeira conexão. O servidor MySQL precisa estar ligado (no XAMPP, módulo MySQL > Start).
spring.datasource.url=jdbc:mysql://localhost:3306/cristalmaster?createDatabaseIfNotExist=true
# A senha NÃO fica escrita aqui: vem da variável de ambiente DB_SENHA (ou SPRING_DATASOURCE_PASSWORD)
# ou do arquivo local ".env", que não vai para o Git (modelo em .env.example). Sem nada, a senha é vazia.
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_SENHA:}
