# Perfil "xampp" (Aula 08): para rodar em casa / na máquina do parceiro com o MySQL do XAMPP,
# que vem com o usuário root SEM senha. Só substitui a senha; o resto vem do application.properties.
#
# Como usar (PowerShell, na pasta do projeto):
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=xampp"
# Sem o perfil, vale a senha do banco da apresentação (application.properties).
spring.datasource.password=
