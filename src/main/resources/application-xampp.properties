# Perfil "xampp": MySQL do XAMPP, que vem com o usuário root SEM senha.
# Como usar (PowerShell, na pasta do projeto):
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=xampp"
# Ignora DB_SENHA e usa senha vazia. Sem este perfil nem o "mysql", a API usa o H2 embutido (sem MySQL).
spring.datasource.url=jdbc:mysql://localhost:3306/cristalmaster?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
