# Nome da aplicação (aparece nos logs).
spring.application.name=cristalmaster
# Conexão com o MySQL: servidor localhost, porta 3306 e banco "cristalmaster".
# createDatabaseIfNotExist=true: se o banco não existir, o driver o cria sozinho na primeira execução
# (não é preciso rodar CREATE DATABASE nem abrir o Workbench). O servidor MySQL precisa estar ligado
# (no XAMPP, basta iniciar o módulo MySQL).
spring.datasource.url=jdbc:mysql://localhost:3306/cristalmaster?createDatabaseIfNotExist=true
# Usuário e senha do MySQL. Configurado para o banco da apresentação (senha definida abaixo).
# Atenção: o XAMPP instala o MySQL com o root SEM senha; para testar nele, deixe a linha da senha vazia
# (spring.datasource.password=). Evite deixar senhas reais em repositório público.
spring.datasource.username=root
spring.datasource.password=senai

# update: o Hibernate cria/ajusta as tabelas (produtos, lotes, movimentacoes, perfis) a partir das entidades.
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL executado e o formata para leitura (útil na apresentação).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true