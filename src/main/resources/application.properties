# Nome da aplicação (aparece nos logs).
spring.application.name=cristalmaster
# Conexão com o MySQL: servidor localhost, porta 3306 e banco "cristalmaster".
# createDatabaseIfNotExist=true: se o banco não existir, o driver o cria sozinho na primeira execução
# (não é preciso rodar CREATE DATABASE nem abrir o Workbench). O servidor MySQL precisa estar ligado
# (no XAMPP, basta iniciar o módulo MySQL).
spring.datasource.url=jdbc:mysql://localhost:3306/cristalmaster?createDatabaseIfNotExist=true
# Usuário e senha do MySQL. A senha NÃO fica escrita aqui: vem da variável de ambiente DB_SENHA
# (ou SPRING_DATASOURCE_PASSWORD, que o Spring Boot já entende) ou do arquivo local ".env", que não vai para o Git
# (modelo em .env.example). Sem nada definido, a senha é vazia, que é o padrão do MySQL do XAMPP.
spring.config.import=optional:file:.env[.properties]
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_SENHA:}

# update: o Hibernate cria/ajusta as tabelas (produtos, lotes, movimentacoes, perfis) a partir das entidades.
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL executado e o formata para leitura (útil na apresentação).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Aula 08: tela (HTML/CSS/JS) lida direto de src/main/resources/static quando a API roda pela pasta do projeto.
# Assim uma alteração no CSS/JS aparece só recarregando a página (F5), sem reiniciar a API.
# Se a pasta não existir (ex.: rodando o .jar em outro lugar), usa a cópia empacotada (classpath:/static/).
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
# Cache-Control: no-cache -> o navegador sempre confere com o servidor se o CSS/JS mudou.
spring.web.resources.cache.cachecontrol.no-cache=true
