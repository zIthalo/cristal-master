# Nome da aplicação (aparece nos logs).
spring.application.name=cristalmaster
# Banco padrão: H2 em ARQUIVO, embutido no programa. Não precisa instalar nem ligar nenhum servidor:
# na primeira execução o arquivo dados/cristalmaster.mv.db é criado sozinho na pasta onde a API roda
# e os dados ficam guardados nele (apague a pasta "dados" para zerar). Só um programa por vez abre o arquivo.
# MODE=MySQL deixa o H2 compatível com o jeito do MySQL. Para usar o MySQL no lugar, ative o perfil "mysql"
# (ou "xampp"): veja application-mysql.properties e o README.
# O caminho pode ser trocado com a variável DB_ARQUIVO (ex.: C:/CristalMaster/cristalmaster). O iniciar.bat faz isso
# sozinho quando o projeto está dentro do OneDrive, que costuma travar o arquivo do banco.
spring.datasource.url=jdbc:h2:file:${DB_ARQUIVO:./dados/cristalmaster};MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.config.import=optional:file:.env[.properties]

# update: o Hibernate cria/ajusta as tabelas (produtos, lotes, movimentacoes, perfis) a partir das entidades.
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL executado e o formata para leitura (útil na apresentação).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Aula 08: tela (HTML/CSS/JS) lida direto de src/main/resources/static quando a API roda pela pasta do projeto.
# Assim uma alteração no CSS/JS aparece só recarregando a página (F5), sem reiniciar a API.
# Se a pasta não existir (ex.: rodando o .jar em outro lugar), usa a cópia empacotada (classpath:/static/).
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
# Cache-Control: no-cache -> o navegador sempre confere com o servidor se o CSS/JS mudou.
spring.web.resources.cache.cachecontrol.no-cache=true
