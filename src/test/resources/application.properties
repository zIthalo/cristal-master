# Configuração só dos testes: banco H2 em MEMÓRIA (some ao terminar), sem tocar na pasta dados/ nem no MySQL.
# Este arquivo substitui o application.properties principal durante o "mvnw test".
spring.application.name=cristalmaster-teste
spring.datasource.url=jdbc:h2:mem:cmtest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
